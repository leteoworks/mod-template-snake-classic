name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate manifest
        run: pnpm validate
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Verify dist/mod.js
        run: |
          test -f dist/mod.js
          ls -la dist/mod.js
          ! grep -q "require('./types')" dist/mod.js
          ! grep -q "require(\"./types\")" dist/mod.js
